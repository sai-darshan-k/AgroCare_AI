<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech Functionality - AgroCare</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        body {
            background-image: url('{{ url_for("static", filename="bg4.webp") }}');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
            color: #131111;
            background-color: transparent;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo img {
            height: 50px;
            margin-right: 10px;
            background-color: transparent;
        }
        .logo, .title, .language-switcher {
            display: inline-block;
            vertical-align: middle;
        }
        .title h2 {
            margin: 0;
            font-size: 24px;
        }
        .language-switcher button {
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .language-switcher button:hover {
            background-color: #45a049;
        }
        .speech-input {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 40px;
        }
        #startSpeechButton, .go-back-button {
            background-color: green;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
            transition: background-color 0.3s;
        }
        #startSpeechButton:hover, .go-back-button:hover {
            background-color: #45a049;
        }
        .qa-container {
            margin-top: 30px;
            text-align: left;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 8px;
        }
        .completion {
            white-space: pre-wrap;
            font-family: Arial, sans-serif;
            font-size: 14px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
            margin-bottom: 10px;
        }
        .audio-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .play-button {
            background-color: green;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            flex-basis: 100%;
        }
        .play-button:hover {
            background-color: #45a049;
        }
        .audio-player-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-top: 20px;
        }
        #homeButton {
            background-color: green;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
    </style>
</head>
<body>
    <div style="position: fixed; top: 10px; left: 10px;">
        <label for="language-select">Select Language:</label>
        <select id="language-select">
            <option value="en-US">English</option>
            <option value="kn-IN">Kannada</option>
            <option value="ta-IN">Tamil</option>
            <option value="hi-IN">Hindi</option>
            <option value="te-IN">Telugu</option>
        </select>
    </div>
    <header>
        <div class="logo">
            <img src="{{ url_for('static', filename='mainlogo.png') }}" alt="AgroCare">
            <h1>Kissan 4.0</h1>
        </div>
        <div class="title">
            <h2>Ask Your Questions!!</h2>
        </div>
    </header>
    
    <div class="audio-player-container">
        <audio controls id="audioPlayer">
            <source src="" type="audio/mp3">
            Your browser does not support the audio element.
        </audio>
    </div>

    <main>
        <div class="speech-input">
            <button id="startSpeechButton" onclick="startSpeechRecognition()">Start Talking</button>
            <button class="go-back-button" onclick="window.history.back()">Go Back</button>
            <button id="homeButton" onclick="window.location.href='{{ url_for('index') }}'">Home</button>
        </div>
        <div class="qa-container" id="botResponse">
            <!-- Response will be appended here -->
        </div>
    </main>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script>
        let utterance;
        let isPlaying = false;
        let playPauseButton;
        let selectedLanguage = "en-US"; // Default language

        // Update language selection
        document.getElementById("language-select").addEventListener("change", function () {
            selectedLanguage = this.value;
        });

        function startSpeechRecognition() {
            document.getElementById('botResponse').innerHTML = '';
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = selectedLanguage; // Use selected language for recognition
            recognition.interimResults = false;

            recognition.onresult = function (event) {
                const transcript = event.results[0][0].transcript;
                const questionDiv = document.createElement('div');
                questionDiv.classList.add('completion');
                questionDiv.innerHTML = `<strong>Question:</strong> ${transcript}`;
                document.getElementById('botResponse').appendChild(questionDiv);
                submitQuestion(transcript, selectedLanguage);
            };

            recognition.onerror = function (event) {
                console.error('Speech recognition error:', event.error);
                alert('Error occurred in speech recognition: ' + event.error);
            };

            recognition.start();
        }

        function submitQuestion(question, lang) {
            $.ajax({
                url: '/ask_speech',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ question: question, language: lang }),
                success: function(response) {
                    const answer = response.answer;
                    const audioUrl = response.audio_url;

                    // Display the translated response
                    const botResponseDiv = document.getElementById('botResponse');
                    const answerDiv = document.createElement('div');
                    answerDiv.classList.add('completion');
                    answerDiv.innerHTML = `<strong>Response:</strong> <br>${answer}`;
                    botResponseDiv.appendChild(answerDiv);

                    // Update the audio player
                    const audioElement = document.getElementById('audioPlayer');
                    audioElement.src = audioUrl;
                    audioElement.style.display = 'block';
                    audioElement.play();
                },
                error: function(error) {
                    console.error('Error:', error);
                    alert('Error occurred while sending the question. Please try again later.');
                }
            });
        }
    </script>
</body>
</html>
