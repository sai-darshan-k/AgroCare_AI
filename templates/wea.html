        <style>
            * {

/* Update the weather container styles */

    <body>
        <div class="dashboard-container">
            <header class="header">

                        <canvas id="temperatureTrendChart"></canvas>

    <script>
        const apiKey = 'e10f65c590d431935edaaf55555c6146';
        let map, marker;
        let currentPosition = { lat: 0, lon: 0 };
      
        // Store chart instances
        let charts = {
            hourly: null,
            temperature: null,
            windRose: null
        };
      
        // Initialize map only once
        function initMap(lat, lon) {
            if (!map) {
                map = L.map('map', {
                    zoomControl: false,
                    attributionControl: false
                }).setView([lat, lon], 10);
      
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                }).addTo(map);
      
                const customIcon = L.divIcon({
                    className: 'custom-marker',
                    html: '<div style="background: #3b82f6; width: 20px; height: 20px; border-radius: 50%; border: 3px solid white;"></div>'
                });
      
                marker = L.marker([lat, lon], { icon: customIcon }).addTo(map);
            } else {
                // Update map view instead of re-creating
                map.setView([lat, lon], 10);
                marker.setLatLng([lat, lon]);
            }
        }
      
        // Get current location with proper handling
        function getCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    position => {
                        currentPosition.lat = position.coords.latitude;
                        currentPosition.lon = position.coords.longitude;
                        initMap(currentPosition.lat, currentPosition.lon);
                        fetchWeatherData();
                    },
                    error => {
                        console.error("Location error:", error);
                        currentPosition.lat = 51.5074;  // Default to London
                        currentPosition.lon = -0.1278;
                        initMap(currentPosition.lat, currentPosition.lon);
                        fetchWeatherData();
                    },
                    { timeout: 10000 }
                );
            } else {
                console.warn("Geolocation not supported.");
                currentPosition.lat = 51.5074;
                currentPosition.lon = -0.1278;
                initMap(currentPosition.lat, currentPosition.lon);
                fetchWeatherData();
            }
        }
      
        // Fetch Weather Data only when needed
        async function fetchWeatherData() {
            try {
                const [weatherResponse, forecastResponse, aqiResponse] = await Promise.all([
                    fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${currentPosition.lat}&lon=${currentPosition.lon}&appid=${apiKey}&units=metric`),
                    fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${currentPosition.lat}&lon=${currentPosition.lon}&appid=${apiKey}&units=metric`),
                    fetch(`https://api.openweathermap.org/data/2.5/air_pollution?lat=${currentPosition.lat}&lon=${currentPosition.lon}&appid=${apiKey}`)
                ]);
      
                const weatherData = await weatherResponse.json();
                const forecastData = await forecastResponse.json();
                const aqiData = await aqiResponse.json();
      
                updateCurrentWeather(weatherData);
                updateHourlyForecast(forecastData);
                updateFiveDayForecast(forecastData);
                updateTemperatureTrend(forecastData);
                updateWindRose(weatherData);
                updateAQI(aqiData);
      
            } catch (error) {
                console.error("Error fetching weather data:", error);
            }
        }
      
        // Update current weather
        function updateCurrentWeather(data) {
            document.querySelector('.temp-display').textContent = `${Math.round(data.main.temp)}°C`;
            document.querySelector('.location-display').textContent = data.name;
            document.querySelector('.weather-description').textContent = data.weather[0].description;
            document.querySelector('.humidity').textContent = `${data.main.humidity}%`;
            document.querySelector('.wind-speed').textContent = `${data.wind.speed} m/s`;
        }
      
        // Fetch Data every 5 minutes
        getCurrentLocation();
        setInterval(fetchWeatherData, 300000);
      
        // Update Hourly Forecast Chart
        function updateHourlyForecast(data) {
            if (charts.hourly) {
                charts.hourly.destroy();
            }
      
            const ctx = document.getElementById('hourlyChart').getContext('2d');
            const temps = data.list.slice(0, 16).map(item => Math.round(item.main.temp));
            const times = data.list.slice(0, 16).map(item =>
                new Date(item.dt * 1000).toLocaleTimeString('en-US', { hour: 'numeric' })
            );
      
            charts.hourly = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: times,
                    datasets: [{
                        label: 'Temperature (°C)',
                        data: temps,
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        fill: true,
                        tension: 0.4,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            },
                            ticks: { color: '#e2e8f0' }
                        },
                        x: {
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            },
                            ticks: { color: '#e2e8f0' }
                        }
                    }
                }
            });
        }
           // Update the forecast data fetching
           async function fetchWeatherData() {
            try {
                const [weatherResponse, forecastResponse, aqiResponse] = await Promise.all([
                    fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${currentPosition.lat}&lon=${currentPosition.lon}&appid=${apiKey}&units=metric`),
                    fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${currentPosition.lat}&lon=${currentPosition.lon}&appid=${apiKey}&units=metric&cnt=48`), // Ensure we get enough data points
                    fetch(`https://api.openweathermap.org/data/2.5/air_pollution?lat=${currentPosition.lat}&lon=${currentPosition.lon}&appid=${apiKey}`)
                ]);

                const weatherData = await weatherResponse.json();
                const forecastData = await forecastResponse.json();
                const aqiData = await aqiResponse.json();

                updateCurrentWeather(weatherData);
                updateHourlyForecast(forecastData);
                updateSixDayForecast(forecastData); // Renamed function
                updateTemperatureTrend(forecastData);
                updateWindRose(weatherData);
                updateAQI(aqiData);

            } catch (error) {
                console.error("Error fetching weather data:", error);
            }
        }

        // Updated forecast function to ensure 6 days are shown
        function updateSixDayForecast(data) {
            const forecastContainer = document.getElementById('forecast');
            forecastContainer.innerHTML = '';
            
            // Get today's date at midnight for comparison
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            // Create an array to store one forecast per day
            const dailyForecasts = [];
            const seenDates = new Set();
            
            // Process forecast data
            data.list.forEach(item => {
                const date = new Date(item.dt * 1000);
                date.setHours(0, 0, 0, 0);
                const dateStr = date.toISOString().split('T')[0];
                
                // Only take the first forecast for each day
                if (!seenDates.has(dateStr)) {
                    seenDates.add(dateStr);
                    dailyForecasts.push(item);
                }
            });
            
            // Add today's weather if needed
            if (dailyForecasts.length < 6) {
                const currentDate = new Date();
                const currentDateStr = currentDate.toISOString().split('T')[0];
                if (!seenDates.has(currentDateStr)) {
                    dailyForecasts.unshift(data.list[0]);
                }
            }
            
            // Take only the first 6 days
            dailyForecasts.slice(0, 6).forEach(day => {
                const date = new Date(day.dt * 1000);
                const temp = Math.round(day.main.temp);
                const icon = day.weather[0].icon;
                
                const forecastItem = document.createElement('div');
                forecastItem.className = 'forecast-item';
                forecastItem.innerHTML = `
                    <div style="font-size: 1.1rem; font-weight: bold">${date.toLocaleDateString('en-US', { weekday: 'short' })}</div>
                    <img src="https://openweathermap.org/img/wn/${icon}@2x.png" alt="Weather icon" style="width: 50px; height: 50px">
                    <div style="font-size: 1.2rem">${temp}°C</div>
                    <div style="opacity: 0.8">${day.weather[0].description}</div>
                `;
                forecastContainer.appendChild(forecastItem);
            });
        }
        // Update Temperature Trend
        function updateTemperatureTrend(data) {
            if (charts.temperature) {
                charts.temperature.destroy();
            }
      
            // Get or create a new canvas for the temperature trend chart
            const tempCanvas = document.getElementById('temperatureTrendChart');
            if (!tempCanvas) {
                const newCanvas = document.createElement('canvas');
                newCanvas.id = 'temperatureTrendChart';
                document.querySelector('.chart-container').appendChild(newCanvas);
            }
      
            const ctx = document.getElementById('temperatureTrendChart').getContext('2d');
      
            const temps = data.list.map(item => ({
                temp: Math.round(item.main.temp),
                feels: Math.round(item.main.feels_like)
            }));
            const times = data.list.map(item => 
                new Date(item.dt * 1000).toLocaleDateString('en-US', { weekday: 'short', hour: 'numeric' })
            );
      
            charts.temperature = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: times,

                        {

                            label: 'Feels Like',

                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top'
                        }
                    }
                }
            });
        }
      
        // Wind Rose chart
        function updateWindRose(data) {
            const ctx = document.getElementById('windRoseChart').getContext('2d');
            const windSpeed = data.wind.speed;
            const windDeg = data.wind.deg;
      
            // Convert wind direction to cardinal points
            const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            const index = Math.round(((windDeg + 22.5) % 360) / 45);
            const direction = directions[index];
      
            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: directions,
                    datasets: [{
                        data: directions.map(d => d === direction ? windSpeed : 0),
                        backgroundColor: 'rgba(59, 130, 246, 0.2)',
                        borderColor: '#3b82f6',
                        pointBackgroundColor: '#3b82f6',
                        pointBorderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            beginAtZero: true,
                            ticks: {
                                color: '#e2e8f0',
                                backdropColor: 'transparent'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            },
                            angleLines: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            },
                            pointLabels: {
                                color: '#e2e8f0'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }
      
// Fetch and update AQI with enhanced visualization
function updateAQI(data) {
    // OpenWeatherMap AQI uses 'list' to contain multiple components
    const aqi = data.list[0].main.aqi;  // AQI from OpenWeatherMap
    const aqiDescription = getAQIDescription(aqi);
    const aqiColor = getAQIColor(aqi);

    // Update AQI display
    const aqiLevel = document.querySelector('.aqi-level');
    const aqiValue = document.querySelector('.aqi-value');
    const aqiDesc = document.querySelector('.aqi-description');
    
    aqiLevel.style.backgroundColor = aqiColor;
    aqiValue.textContent = `AQI: ${aqi}`;
    aqiDesc.textContent = aqiDescription;

    // Extract the pollutant components from the data
    const pm25 = data.list[0].components.pm2_5;  // PM2.5 in µg/m³
    const pm10 = data.list[0].components.pm10;  // PM10 in µg/m³
    const co = data.list[0].components.co;      // CO in µg/m³
    const so2 = data.list[0].components.so2;    // SO2 in ppb
    const no2 = data.list[0].components.no2;    // NO2 in ppb
    const o3 = data.list[0].components.o3;      // O3 in ppb

    // Update pollutant values
    document.querySelector('.pm25-value').textContent = `${pm25} μg/m³`;
    document.querySelector('.pm25-status').textContent = getPollutantStatus(pm25, 'pm25');
    
    document.querySelector('.pm10-value').textContent = `${pm10} μg/m³`;
    document.querySelector('.pm10-status').textContent = getPollutantStatus(pm10, 'pm10');
    
    document.querySelector('.co-value').textContent = `${co} ppm`;
    document.querySelector('.co-status').textContent = getPollutantStatus(co, 'co');
    
    document.querySelector('.so2-value').textContent = `${so2} ppb`;
    document.querySelector('.so2-status').textContent = getPollutantStatus(so2, 'so2');
    
    document.querySelector('.no2-value').textContent = `${no2} ppb`;
    document.querySelector('.no2-status').textContent = getPollutantStatus(no2, 'no2');
    
    document.querySelector('.o3-value').textContent = `${o3} ppb`;
    document.querySelector('.o3-status').textContent = getPollutantStatus(o3, 'o3');
}

// Function to get the status (Good, Fine, etc.) for pollutants
function getPollutantStatus(value, pollutant) {
    const thresholds = {
        pm25: { good: 35, fine: 55 },
        pm10: { good: 50, fine: 150 },
        co: { good: 1.0 },
        so2: { good: 5.0 },
        no2: { good: 53 },
        o3: { good: 0.070 }
    };

    let status = "Good";
    
    switch (pollutant) {
        case 'pm25':
            if (value > thresholds.pm25.fine) status = "Fine";
            break;
        case 'pm10':
            if (value > thresholds.pm10.fine) status = "Fine";
            break;
        case 'co':
            if (value > thresholds.co.good) status = "Good";
            break;
        case 'so2':
            if (value > thresholds.so2.good) status = "Good";
            break;
        case 'no2':
            if (value > thresholds.no2.good) status = "Good";
            break;
        case 'o3':
            if (value > thresholds.o3.good) status = "Good";
            break;
        default:
            status = "Good";
            break;
    }
    
    return status;
}

// Get AQI description based on value
function getAQIDescription(aqi) {
    const descriptions = {
        1: "Good",
        2: "Fair",
        3: "Moderate",
        4: "Poor",
        5: "Very Poor"
    };
    return descriptions[aqi] || "Unknown";
}

// Get AQI color based on value
function getAQIColor(aqi) {
    const colors = {
        1: '#22c55e', // Good - Green
        2: '#eab308', // Fair - Yellow
        3: '#f97316', // Moderate - Orange
        4: '#ef4444', // Poor - Red
        5: '#7f1d1d'  // Very Poor - Dark Red
    };
    return colors[aqi] || '#71717a';
}
