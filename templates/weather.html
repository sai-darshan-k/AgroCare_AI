    <script>
        const apiKey = 'e10f65c590d431935edaaf55555c6146';
        let map, marker;
        let currentPosition = { lat: 0, lon: 0 };
      
        // Store chart instances
        let charts = {
            hourly: null,
            temperature: null,
            windRose: null
        };

        // Initialize map only once
        function initMap(lat, lon) {
            if (!map) {
                map = L.map('map', {
                    zoomControl: false,
                    attributionControl: false
                }).setView([lat, lon], 10);
      
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                }).addTo(map);
      
                const customIcon = L.divIcon({
                    className: 'custom-marker',
                    html: '<div style="background: #3b82f6; width: 20px; height: 20px; border-radius: 50%; border: 3px solid white;"></div>'
                });
      
                marker = L.marker([lat, lon], { icon: customIcon }).addTo(map);
            } else {
                // Update map view instead of re-creating
                map.setView([lat, lon], 10);
                marker.setLatLng([lat, lon]);
            }
        }
      
        function getCurrentLocation() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            position => {
                console.log("Geolocation Success:", position.coords.latitude, position.coords.longitude);
                currentPosition.lat = position.coords.latitude;
                currentPosition.lon = position.coords.longitude;
                initMap(currentPosition.lat, currentPosition.lon);
                fetchWeatherData();
            },
            error => {
                console.error("Geolocation Error:", error.message, error.code);
                // Default to a different location for testing, e.g., New York
                currentPosition.lat = 40.8239;
                currentPosition.lon = -73.8371;
                initMap(currentPosition.lat, currentPosition.lon);
                fetchWeatherData();
            },
            { timeout: 10000, enableHighAccuracy: true, maximumAge: 0 }
        );
    } else {
        console.warn("Geolocation not supported by browser.");
        currentPosition.lat = 40.8239;
        currentPosition.lon = -73.8371;
        initMap(currentPosition.lat, currentPosition.lon);
        fetchWeatherData();
    }
}
      
        async function fetchWeatherData() {
    try {
        const [weatherResponse, forecastResponse, aqiResponse] = await Promise.all([
            fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${currentPosition.lat}&lon=${currentPosition.lon}&appid=${apiKey}&units=metric`),
            fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${currentPosition.lat}&lon=${currentPosition.lon}&appid=${apiKey}&units=metric`),
            fetch(`https://api.openweathermap.org/data/2.5/air_pollution?lat=${currentPosition.lat}&lon=${currentPosition.lon}&appid=${apiKey}`)
        ]);

        const weatherData = await weatherResponse.json();
        const forecastData = await forecastResponse.json();
        const aqiData = await aqiResponse.json();

        // Update the UI with the fetched data
        updateCurrentWeather(weatherData);
        updateHourlyForecast(forecastData);
        updateSixDayForecast(forecastData);
        updateTemperatureTrend(forecastData);

        // Updated forecast function to ensure 6 days are shown
        function updateSixDayForecast(data) {
            const forecastContainer = document.getElementById('forecast');
            forecastContainer.innerHTML = '';
            
            // Get today's date at midnight for comparison
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            // Create an array to store one forecast per day
            const dailyForecasts = [];
            const seenDates = new Set();
            
            // Process forecast data
            data.list.forEach(item => {
                const date = new Date(item.dt * 1000);
                date.setHours(0, 0, 0, 0);
                const dateStr = date.toISOString().split('T')[0];
                
                // Only take the first forecast for each day
                if (!seenDates.has(dateStr)) {
                    seenDates.add(dateStr);
                    dailyForecasts.push(item);
                }
            });
            
            // Add today's weather if needed
            if (dailyForecasts.length < 6) {
                const currentDate = new Date();
                const currentDateStr = currentDate.toISOString().split('T')[0];
                if (!seenDates.has(currentDateStr)) {
                    dailyForecasts.unshift(data.list[0]);
                }
            }
            
            // Take only the first 6 days
            dailyForecasts.slice(0, 6).forEach(day => {
                const date = new Date(day.dt * 1000);
                const temp = Math.round(day.main.temp);
                const icon = day.weather[0].icon;
                
                const forecastItem = document.createElement('div');
                forecastItem.className = 'forecast-item';
                forecastItem.innerHTML = `
                    <div style="font-size: 1.1rem; font-weight: bold">${date.toLocaleDateString('en-US', { weekday: 'short' })}</div>
                    <img src="https://openweathermap.org/img/wn/${icon}@2x.png" alt="Weather icon" style="width: 50px; height: 50px">
                    <div style="font-size: 1.2rem">${temp}°C</div>
                    <div style="opacity: 0.8">${day.weather[0].description}</div>
                `;
                forecastContainer.appendChild(forecastItem);
            });
        }

function updateAQI(data) {
    if (!data || !data.list || data.list.length === 0) {
        console.error("Invalid AQI data:", data);
        return;
    }

    const aqi = data.list[0].main.aqi;  // AQI from OpenWeatherMap
    const aqiDescription = getAQIDescription(aqi);
    const aqiColor = getAQIColor(aqi);

    // Update AQI display
    const aqiLevel = document.querySelector('.aqi-level');
    const aqiValue = document.querySelector('.aqi-value');
    const aqiDesc = document.querySelector('.aqi-description');

    aqiLevel.style.backgroundColor = aqiColor;
    aqiValue.textContent = `AQI Level: ${aqi}`;
    aqiDesc.textContent = aqiDescription;

    // Extract the pollutant components from the data
    const pm25 = data.list[0].components.pm2_5;  // PM2.5 in µg/m³
    const pm10 = data.list[0].components.pm10;  // PM10 in µg/m³
    const co = data.list[0].components.co / 1000;  // Convert µg/m³ to ppm
    const so2 = data.list[0].components.so2;    // SO2 in ppb
    const no2 = data.list[0].components.no2;    // NO2 in ppb
    const o3 = data.list[0].components.o3;      // O3 in ppb

    // Update pollutant values
    document.querySelector('.pm25-value').textContent = `${pm25} μg/m³`;
    document.querySelector('.pm25-status').textContent = getPollutantStatus(pm25, 'pm25');

    document.querySelector('.pm10-value').textContent = `${pm10} μg/m³`;
    document.querySelector('.pm10-status').textContent = getPollutantStatus(pm10, 'pm10');

    document.querySelector('.co-value').textContent = `${co.toFixed(2)} ppm`;
    document.querySelector('.co-status').textContent = getPollutantStatus(co, 'co');

    document.querySelector('.so2-value').textContent = `${so2} ppb`;
    document.querySelector('.so2-status').textContent = getPollutantStatus(so2, 'so2');

    document.querySelector('.no2-value').textContent = `${no2} ppb`;
    document.querySelector('.no2-status').textContent = getPollutantStatus(no2, 'no2');

    document.querySelector('.o3-value').textContent = `${o3} ppb`;
    document.querySelector('.o3-status').textContent = getPollutantStatus(o3, 'o3');
}

// Function to get the status (Good, Fine, etc.) for pollutants
function getPollutantStatus(value, pollutant) {
    const thresholds = {
        pm25: { good: 12, moderate: 35.4, unhealthy_sensitive: 55.4 },
        pm10: { good: 54, moderate: 154 },
        co: { good: 4.4, moderate: 9.4, unhealthy: 12.4 }, // ppm
        so2: { good: 35, moderate: 75 },
        no2: { good: 53, moderate: 100 },
        o3: { good: 54, moderate: 70 }
    };

    let status = "Good";
    
    switch (pollutant) {
        case 'pm25':
            if (value > thresholds.pm25.unhealthy_sensitive) status = "Unhealthy";
            else if (value > thresholds.pm25.moderate) status = "Moderate";
            break;
        case 'pm10':
            if (value > thresholds.pm10.moderate) status = "Unhealthy";
            else if (value > thresholds.pm10.good) status = "Moderate";
            break;
        case 'co':
            if (value > thresholds.co.unhealthy) status = "Unhealthy";
            else if (value > thresholds.co.moderate) status = "Moderate";
            break;
        case 'so2':
            if (value > thresholds.so2.moderate) status = "Unhealthy";
            else if (value > thresholds.so2.good) status = "Moderate";
            break;
        case 'no2':
            if (value > thresholds.no2.moderate) status = "Unhealthy";
            else if (value > thresholds.no2.good) status = "Moderate";
            break;
        case 'o3':
            if (value > thresholds.o3.moderate) status = "Unhealthy";
            else if (value > thresholds.o3.good) status = "Moderate";
            break;
        default:
            status = "Good";
            break;
    }
    
    return status;
}

// Get AQI description based on value
function getAQIDescription(aqi) {
    const descriptions = {
        1: "Good",
        2: "Fair",
        3: "Moderate",
        4: "Unhealthy",
        5: "Very Unhealthy"
    };
    return descriptions[aqi] || "Unknown";
}

// Get AQI color based on value
function getAQIColor(aqi) {
    const colors = {
        1: '#22c55e', // Good - Green
        2: '#eab308', // Fair - Yellow
        3: '#f97316', // Moderate - Orange
        4: '#ef4444', // Unhealthy - Red
        5: '#7f1d1d'  // Very Unhealthy - Dark Red
    };
    return colors[aqi] || '#71717a';
}

function updateAQI(data) {
    if (!data || !data.list || data.list.length === 0) {
        console.error("Invalid AQI data:", data);
        return;
    }

    const currentData = data.list[0];
    const aqi = currentData.main.aqi;
    const components = currentData.components;

    // Update main AQI display
    const aqiValue = document.querySelector('.aqi-value');
    const aqiDesc = document.querySelector('.aqi-description');
    const aqiLevel = document.querySelector('.aqi-level');

    aqiValue.textContent = `AQI: ${aqi}`;
    aqiDesc.textContent = getAQIDescription(aqi);
    aqiLevel.style.backgroundColor = getAQIColor(aqi);

    // Helper function to update a metric element
    function updateMetric(selector, value, unit, pollutant) {
        const valueElement = document.querySelector(`${selector}-value`);
        const statusElement = document.querySelector(`${selector}-status`);
        
        if (valueElement) {
            valueElement.textContent = `${value.toFixed(1)} ${unit}`;
        }
        if (statusElement) {
            statusElement.textContent = getPollutantStatus(value, pollutant);
            statusElement.style.color = getPollutantStatusColor(value, pollutant);
        }
    }

    // Update individual pollutants
    updateMetric('.pm25', components.pm2_5, 'μg/m³', 'pm25');
    updateMetric('.pm10', components.pm10, 'μg/m³', 'pm10');
    updateMetric('.co', components.co / 1000, 'ppm', 'co');
    updateMetric('.so2', components.so2, 'ppb', 'so2');
    updateMetric('.no2', components.no2, 'ppb', 'no2');
    updateMetric('.o3', components.o3, 'ppb', 'o3');
}

// Add this new function to get status colors
function getPollutantStatusColor(value, pollutant) {
    const status = getPollutantStatus(value, pollutant);
    const colors = {
        'Good': '#22c55e',
        'Moderate': '#f97316',
        'Unhealthy': '#ef4444'
    };
    return colors[status] || '#71717a';
}

// Update the fetchWeatherData function to handle errors better
async function fetchWeatherData() {
    try {
        const [weatherResponse, forecastResponse, aqiResponse] = await Promise.all([
            fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${currentPosition.lat}&lon=${currentPosition.lon}&appid=${apiKey}&units=metric`),
            fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${currentPosition.lat}&lon=${currentPosition.lon}&appid=${apiKey}&units=metric`),
            fetch(`https://api.openweathermap.org/data/2.5/air_pollution?lat=${currentPosition.lat}&lon=${currentPosition.lon}&appid=${apiKey}`)
        ]);

        if (!weatherResponse.ok || !forecastResponse.ok || !aqiResponse.ok) {
            throw new Error('One or more API requests failed');
        }

        const [weatherData, forecastData, aqiData] = await Promise.all([
            weatherResponse.json(),
            forecastResponse.json(),
            aqiResponse.json()
        ]);

        updateCurrentWeather(weatherData);
        updateHourlyForecast(forecastData);
        updateSixDayForecast(forecastData);
        updateTemperatureTrend(forecastData);
        updateWindRose(weatherData);
        updateAQI(aqiData);

    } catch (error) {
        console.error("Error fetching weather data:", error);
        // Show error message to user
        const errorMessage = document.createElement('div');
        errorMessage.className = 'error-message';
        errorMessage.textContent = 'Failed to update weather data. Please try again later.';
        errorMessage.style.cssText = 'position: fixed; top: 20px; right: 20px; background: #ef4444; color: white; padding: 1rem; border-radius: 0.5rem; z-index: 1000;';
        document.body.appendChild(errorMessage);
        setTimeout(() => errorMessage.remove(), 5000);
    }
}
